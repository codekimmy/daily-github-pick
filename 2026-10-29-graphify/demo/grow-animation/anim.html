<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#07080d;overflow:hidden}canvas{display:block}</style>
<script src="d3.min.js"></script><script src="data.js"></script>
</head><body><canvas id="c"></canvas>
<script>
const P = new URLSearchParams(location.search);
const W = +P.get('w') || 1920, H = +P.get('h') || 1080, VERT = H > W;
const FPS = 30;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const S = Math.min(W, H) / 1080;                 // text scale
const FONT = '"Noto Sans CJK KR", sans-serif';
const PAL = ['#ff6b6b','#ffd166','#4cc9f0','#80ed99','#c77dff','#ff9f1c','#f72585','#4895ef','#2ec4b6','#e9c46a'];
const col = c => c < 0 ? '#5b6170' : PAL[c];

// ---------- timeline (seconds) ----------
const T = { intro: 0, grow0: 2.2, grow1: 13.5, settle: 15.5, god0: 15.5, god1: 21, zoom0: 21, zoom1: 26, end0: 26, end1: 30 };
const TOTAL = Math.round(T.end1 * FPS);

// ---------- data ----------
const N = DATA.n.map((d, i) => ({ i, label: d[0], c: d[1], deg: d[2], file: d[3], born: -1 }));
const E = DATA.e.map(([a, b]) => ({ source: a, target: b, born: -1 }));
const adj = N.map(() => []);
E.forEach((e, k) => { adj[e.source].push(k); adj[e.target].push(k); });
const order = DATA.order;
const HUBS = DATA.top, topdeg = DATA.topdeg;

const alive = [], aliveE = [];
const sim = d3.forceSimulation([])
  .force('charge', d3.forceManyBody().strength(-10).theta(1.2).distanceMax(400))
  .force('link', d3.forceLink([]).id(d => d.i).distance(12).strength(0.5))
  .force('x', d3.forceX(0).strength(VERT ? 0.06 : 0.04)).force('y', d3.forceY(0).strength(VERT ? 0.03 : 0.06))
  .alphaDecay(0).alpha(0.6).stop();

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
let added = 0, dirty = false;
function addUpTo(k, f) {
  while (added < k) {
    const n = N[order[added++]];
    // spawn next to an already-alive neighbour if there is one -> looks like growth
    let px = null;
    for (const ei of adj[n.i]) { const e = E[ei]; const o = N[e.source === n.i ? (e.target.i ?? e.target) : (e.source.i ?? e.source)]; if (o && o.born >= 0) { px = o; break; } }
    const a = rnd() * 6.283, r = 6 + rnd() * 10;
    n.x = (px ? px.x : (rnd() - .5) * 60) + Math.cos(a) * r; n.y = (px ? px.y : (rnd() - .5) * 60) + Math.sin(a) * r;
    n.born = f; alive.push(n);
    for (const ei of adj[n.i]) { const e = E[ei]; const s = e.source.i ?? e.source, t = e.target.i ?? e.target;
      if (e.born < 0 && N[s].born >= 0 && N[t].born >= 0) { e.born = f; aliveE.push(e); } }
    dirty = true;
  }
}

// ---------- camera ----------
let cam = { x: 0, y: 0, z: 1 };
function bounds(list) {
  const xs = list.map(n => n.x).sort((a, b) => a - b), ys = list.map(n => n.y).sort((a, b) => a - b);
  const q = (a, p) => a[Math.min(a.length - 1, Math.floor(a.length * p))];
  const x0 = q(xs, .04), x1 = q(xs, .96), y0 = q(ys, .04), y1 = q(ys, .96);
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: Math.max(80, x1 - x0), h: Math.max(80, y1 - y0) };
}
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const sx = x => (x - cam.x) * cam.z + W / 2, sy = y => (y - cam.y) * cam.z + H / 2 + (VERT ? H * 0.04 : 0);

// ---------- text helpers ----------
function txt(s, x, y, size, color, align = 'left', weight = 700, alpha = 1) {
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = `${weight} ${size * S}px ${FONT}`; ctx.fillText(s, x, y); ctx.globalAlpha = 1;
}
function pill(s, x, y, size, bg, fg, alpha = 1) {
  ctx.font = `700 ${size * S}px ${FONT}`; const w = ctx.measureText(s).width + size * S * 1.2, h = size * S * 1.7;
  ctx.globalAlpha = alpha; ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  txt(s, x, y + 1, size, fg, 'center', 700, alpha);
}
const fmt = n => n.toLocaleString('en-US');

// ---------- main frame ----------
window.frame = function (f) {
  const t = f / FPS;

  // grow
  if (t >= T.grow0) {
    const p = Math.min(1, (t - T.grow0) / (T.grow1 - T.grow0));
    addUpTo(Math.round(N.length * (p < 1 ? Math.pow(p, 1.25) : 1)), f);
  }
  if (dirty && f % 2 === 0) { sim.nodes(alive.slice()); sim.force('link').links(aliveE.slice()); dirty = false; }
  if (alive.length) { sim.alpha(t < T.settle ? 0.5 : Math.max(0.02, 0.5 - (t - T.settle) * 0.2)); sim.tick(); }

  // camera target
  let tgt;
  if (alive.length) {
    const b = bounds(alive), z = Math.min(W * (VERT ? 0.95 : 0.62) / b.w, H * (VERT ? 0.55 : 0.82) / b.h, 6);
    tgt = { x: b.cx, y: b.cy, z };
  } else tgt = { x: 0, y: 0, z: 4 };
  if (t >= T.zoom0) {                       // zoom into the #1 hub
    const hub = N[HUBS[0]], k = ease((t - T.zoom0) / 1.8);
    tgt = { x: lerp(tgt.x, hub.x, k), y: lerp(tgt.y, hub.y, k), z: lerp(tgt.z, tgt.z * 2.6, k) };
  }
  if (t >= T.end0) { const k = ease((t - T.end0) / 1.5); tgt.z = lerp(tgt.z, tgt.z * 0.55, k); }
  const sm = t < T.grow1 ? 0.12 : 0.07;
  cam.x = lerp(cam.x, tgt.x, sm); cam.y = lerp(cam.y, tgt.y, sm); cam.z = lerp(cam.z, tgt.z, sm);

  // ---------- draw ----------
  ctx.fillStyle = '#07080d'; ctx.fillRect(0, 0, W, H);
  const godK = t >= T.god0 ? ease((t - T.god0) / 1.2) : 0;
  const endK = t >= T.end0 ? ease((t - T.end0) / 1) : 0;
  const hubSet = new Set(HUBS);
  const zoomK = t >= T.zoom0 ? ease((t - T.zoom0) / 1.2) : 0;
  const hubEdges = new Set(adj[HUBS[0]]);

  // edges
  ctx.lineWidth = Math.max(0.4, 0.6 * cam.z * 0.5) ;
  for (let k = 0; k < aliveE.length; k++) {
    const e = aliveE[k], a = e.source, b = e.target;
    const age = (f - e.born) / 8, fresh = age < 1 ? 1 - age : 0;
    let al = 0.13 + fresh * 0.6;
    al *= 1 - godK * 0.6;
    ctx.globalAlpha = al; ctx.strokeStyle = fresh > 0.2 ? '#ffffff' : col(a.c);
    ctx.beginPath(); ctx.moveTo(sx(a.x), sy(a.y)); ctx.lineTo(sx(b.x), sy(b.y)); ctx.stroke();
  }
  // hub edges light up
  if (zoomK > 0) {
    const hub = N[HUBS[0]], ex = adj[HUBS[0]];
    const shown = Math.floor(ex.length * ease((t - T.zoom0 - 0.6) / 2.2));
    ctx.lineWidth = 1.6 * S; ctx.strokeStyle = '#ffd166';
    for (let k = 0; k < shown; k++) {
      const e = E[ex[k]], o = e.source === hub ? e.target : e.source;
      ctx.globalAlpha = 0.75; ctx.beginPath(); ctx.moveTo(sx(hub.x), sy(hub.y)); ctx.lineTo(sx(o.x), sy(o.y)); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    window.__hubShown = shown;
  }
  // nodes
  for (const n of alive) {
    const age = (f - n.born) / 10, fresh = age < 1 ? 1 - age : 0;
    const r = (1.3 + Math.sqrt(n.deg) * 0.35) * Math.sqrt(cam.z) * 0.9 + fresh * 4 * S;
    ctx.globalAlpha = hubSet.has(n.i) ? 1 : (1 - godK * 0.65);
    ctx.fillStyle = fresh > 0.3 ? '#ffffff' : col(n.c);
    ctx.beginPath(); ctx.arc(sx(n.x), sy(n.y), r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // god nodes rings + labels
  if (godK > 0) {
    HUBS.forEach((id, k) => {
      const n = N[id], kk = ease((t - T.god0 - k * 0.7) / 0.6); if (kk <= 0) return;
      const x = sx(n.x), y = sy(n.y), R = (16 + Math.sqrt(topdeg[k]) * 2.2) * S * kk;
      const pulse = 1 + 0.12 * Math.sin((t - T.god0) * 5 + k);
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3 * S; ctx.globalAlpha = kk * (1 - zoomK * (k ? 0.85 : 0));
      ctx.beginPath(); ctx.arc(x, y, R * pulse, 0, 6.283); ctx.stroke();
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x, y, 6 * S, 0, 6.283); ctx.fill();
      ctx.globalAlpha = kk * (1 - zoomK * (k ? 1 : 0)); ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x + R * pulse * .72, y - R * pulse * .72, 15 * S, 0, 6.283); ctx.fill();
      txt(String(k + 1), x + R * pulse * .72, y - R * pulse * .72 + 1, 20, '#111', 'center', 900, kk * (1 - zoomK * (k ? 1 : 0)));
      // leaderboard
      const bx = VERT ? W / 2 : W - 430 * S, by = VERT ? H - 640 * S + k * 62 * S : H / 2 - 150 * S + k * 70 * S;
      const la = kk * (1 - zoomK);
      if (la > 0) {
        ctx.globalAlpha = la * .9; ctx.fillStyle = 'rgba(255,209,102,.12)'; ctx.beginPath(); ctx.roundRect(VERT ? bx - 300 * S : bx - 20 * S, by - 26 * S, 380 * S + (VERT ? 220 * S : 0), 52 * S, 12 * S); ctx.fill();
        txt(`${k + 1}위`, VERT ? bx - 270 * S : bx, by, 28, '#ffd166', 'left', 900, la);
        txt(n.label, VERT ? bx - 180 * S : bx + 80 * S, by, 28, '#ffffff', 'left', 700, la);
        txt(`연결 ${topdeg[k]}`, VERT ? bx + 290 * S : bx + 345 * S, by, 24, '#9aa3b5', 'right', 500, la);
      }
    });
  }

  // ---------- HUD ----------
  const fileNow = alive.length ? N[alive[alive.length - 1].i].file : 0;
  const filesDone = Math.min(DATA.files.length, alive.length ? fileNow + 1 : 0);
  const top0 = VERT ? 150 * S : 70 * S, L = VERT ? 60 * S : 70 * S;

  // intro
  if (t < T.grow0 + 0.6) {
    const a = t < 0.3 ? t / 0.3 : t > T.grow0 ? 1 - (t - T.grow0) / 0.6 : 1;
    txt('파일 155개짜리 프로그램', W / 2, H / 2 - 40 * S, VERT ? 64 : 64, '#ffffff', 'center', 900, a);
    txt('지도로 그리면 어떻게 생겼을까?', W / 2, H / 2 + 50 * S, VERT ? 44 : 44, '#9aa3b5', 'center', 500, a);
  }
  // counters
  if (t >= T.grow0 && t < T.end0) {
    const a = Math.min(1, (t - T.grow0) / 0.4) * (1 - zoomK);
    const el = Math.min(t - T.grow0, 5.0);
    if (VERT) {
      txt(t < T.grow1 ? '코드 지도 그리는 중' : '코드 지도 완성', L, top0, 40, '#ffffff', 'left', 900, a);
      txt(`파일 ${filesDone}/155`, L, top0 + 70 * S, 34, '#9aa3b5', 'left', 500, a);
      txt(`코드 조각 ${fmt(alive.length)}`, L, top0 + 120 * S, 34, '#4cc9f0', 'left', 700, a);
      txt(`연결 ${fmt(aliveE.length)}`, L, top0 + 170 * S, 34, '#80ed99', 'left', 700, a);
    } else {
      txt(t < T.grow1 ? '코드 지도 그리는 중' : '코드 지도 완성', L, top0, 34, '#ffffff', 'left', 900, a);
      txt(`파일  ${filesDone} / 155`, L, top0 + 56 * S, 28, '#9aa3b5', 'left', 500, a);
      txt(`코드 조각  ${fmt(alive.length)}`, L, top0 + 100 * S, 28, '#4cc9f0', 'left', 700, a);
      txt(`연결  ${fmt(aliveE.length)}`, L, top0 + 144 * S, 28, '#80ed99', 'left', 700, a);
    }
    if (t < T.grow1 + 0.5) {
      const fn = DATA.files[Math.min(fileNow, DATA.files.length - 1)];
      txt(fn, VERT ? L : L, VERT ? top0 + 225 * S : top0 + 190 * S, VERT ? 26 : 22, '#5b6170', 'left', 400, a);
    }
  }
  // done badge
  if (t >= T.grow1 + 0.2 && t < T.god0 + 0.2) {
    const a = ease((t - T.grow1 - 0.2) / 0.4);
    pill('완성 · 약 5초 · AI 토큰 0', W / 2, VERT ? H - 260 * S : H - 90 * S, VERT ? 40 : 34, 'rgba(128,237,153,.95)', '#08130b', a);
  }
  // god caption
  if (t >= T.god0 && t < T.zoom0 + 0.3) {
    const a = ease((t - T.god0) / 0.6) * (1 - ease((t - T.zoom0) / 0.3));
    pill('연결이 몰리는 "환승역" = 먼저 읽을 핵심 코드', W / 2, VERT ? H - 260 * S : H - 90 * S, VERT ? 34 : 32, 'rgba(255,209,102,.95)', '#111', a);
  }
  // zoom caption
  if (t >= T.zoom0 && t < T.end0 + 0.4) {
    const a = ease((t - T.zoom0 - 0.4) / 0.5) * (1 - ease((t - T.end0) / 0.4));
    const sh = window.__hubShown || 0;
    pill(`1위 Context — 연결 ${sh} / 184`, W / 2, VERT ? 330 * S : 90 * S, VERT ? 44 : 38, 'rgba(255,209,102,.95)', '#111', a);
    txt('여기부터 읽으면 프로그램 구조가 보인다', W / 2, VERT ? H - 260 * S : H - 90 * S, VERT ? 34 : 32, '#ffffff', 'center', 700, a);
  }
  // end card
  if (endK > 0) {
    ctx.globalAlpha = endK * 0.7; ctx.fillStyle = '#07080d'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    txt('Graphify', W / 2, H / 2 - 110 * S, 96, '#ffffff', 'center', 900, endK);
    txt('코드 폴더 → 지하철 노선도', W / 2, H / 2, 46, '#ffd166', 'center', 700, endK);
    txt('파일 155개 · 5초 · 토큰 0 · 무료 오픈소스', W / 2, H / 2 + 80 * S, VERT ? 32 : 34, '#9aa3b5', 'center', 500, endK);
  }
  return f;
};
window.TOTAL = TOTAL;
</script></body></html>
