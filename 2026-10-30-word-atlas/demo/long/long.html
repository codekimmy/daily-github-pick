const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
function text(s, x, y, size, color = INK, weight = 700, align = 'left', alpha = 1, font = F) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y); ctx.restore();
}
const tw = (s, size, weight = 700, font = F) => { ctx.font = `${weight} ${size}px ${font}`; return ctx.measureText(s).width; };
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function box(x, y, w, h, r, fill, stroke, a = 1) { ctx.save(); ctx.globalAlpha *= a; rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); } ctx.restore(); }
function img(im, x, y, w, h, r = 20, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; rr(x, y, w, h, r); ctx.clip(); ctx.drawImage(im, x, y, w, h); ctx.restore(); }
function wrap(s, maxW, size, weight = 400, font = F) {
  ctx.font = `${weight} ${size}px ${font}`; const out = []; let line = '';
  for (const word of s.split(' ')) { const t = line ? line + ' ' + word : word;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = word; } else line = t; }
  if (line) out.push(line); return out;
}
function bars(x, y, on, t, n = 5, col = GOLD) { if (!on) return; for (let b = 0; b < n; b++) { const hh = 10 + 24 * Math.abs(Math.sin(t * 13 + b * 1.7)); ctx.fillStyle = col; ctx.fillRect(x + b * 10, y - hh / 2, 5, hh); } }
function mosaicBG(a) { ctx.save(); ctx.globalAlpha = a; const sw = IM.sprite.width, sh = IM.sprite.height, sc = Math.max(W / sw, H / sh) * 1.05; ctx.drawImage(IM.sprite, (W - sw * sc) / 2, (H - sh * sc) / 2, sw * sc, sh * sc); ctx.restore(); ctx.fillStyle = 'rgba(11,15,28,.82)'; ctx.fillRect(0, 0, W, H); }
const app = (lt, a, d = 0.5) => prog(lt, a, a + d);
const audioOn = (c, name, lt) => (c.audio || []).some(([at, n]) => n === name && lt >= at && lt < at + (name.endsWith('_ex') ? 3.2 : 1.0));

function subtitle(s, a) {
  if (!s || a <= 0) return;
  ctx.font = `700 42px ${F}`; const w = ctx.measureText(s).width;
  ctx.save(); ctx.globalAlpha = a; rr(W / 2 - w / 2 - 34, 920, w + 68, 84, 22); ctx.fillStyle = 'rgba(5,7,13,.86)'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, W / 2, 962); ctx.restore();
}
function frame(f) {
  const t = f / FPS; const c = CH.find(c => t >= c.t0 && t < c.t0 + c.dur) || CH[CH.length - 1]; const lt = t - c.t0;
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = prog(lt, 0, 0.4) * (1 - prog(lt, c.dur - 0.3, c.dur)); SC[c.id](lt, c); ctx.restore();
  if (c.tag) { const a = 1; ctx.font = `700 28px ${F}`; const w = ctx.measureText(c.tag).width; box(36, 28, w + 48, 54, 27, 'rgba(5,7,13,.8)', null, a); text(c.tag, 60, 56, 28, INK, 700, 'left', a); }
  const cue = c.cues.find(q => lt >= q[0] && lt < q[1]);
  if (cue) subtitle(cue[2], prog(lt, cue[0], cue[0] + 0.2) * (1 - prog(lt, cue[1] - 0.15, cue[1])));
}
