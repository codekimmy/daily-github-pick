// 롱폼 본편(미리보기 뒤). 숫자·자막 시각·파형은 모두 실제 시연 결과(../results.json, ../work/*.srt, ../work/voice.wav). 영상은 시연용 가상 영상

const C = R.cases, LONG = R.long, X = R.extra, M = 120, FW = W - 240;

function caption(c, lt) {
  const cue = c.cues.find(q => lt >= q[0] && lt < q[1]); if (!cue) return;
  const a = prog(lt, cue[0], cue[0] + .2) * (1 - prog(lt, cue[1] - .15, cue[1]));

}
function tag(c, lt) {

}
function termLines(x, y, w, h, lines, lt, size = 26, title = '명령 프롬프트 (cmd)') {

    const yy = y + 90 + i * (size * 1.9); if (lt < at - .1) return;
    if (kind === '$') { text('C:\\>', x + 30, yy, size, GREEN, 600, 'left', 1, MONO); text(typed(s, lt, at, at + (dur || 1.6)), x + 30 + tw('C:\\> ', size, 600, MONO), yy, size, INK, 600, 'left', 1, MONO); }

}
// 두 필름 (소리 + 자막). from→to 자막을 k 비율로 옮겨 그림 (각 자막 막대를 정답 시각 쪽으로 보간)

function errRow(vals, y, a, color) { // 문장별 어긋남(초) 막대
