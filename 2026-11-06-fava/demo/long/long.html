// 롱폼 본편(미리보기 뒤). 숫자는 실제 시연 결과(../results.json), 화면은 실제 Fava 캡처(../../media/shots). 가계부는 시연용 가상 자료

let READY = false; Promise.all([document.fonts.load(`800 40px ${F}`), document.fonts.load(`500 20px ${MONO}`), loadShots('../../media/shots')]).then(() => READY = true);
const app = (lt, a, d = 0.5) => prog(lt, a, a + d);
const M = 120, FW = W - 240, MON = R.monthly, LG = R.ledger;
function caption(c, lt) {
  const cue = c.cues.find(q => lt >= q[0] && lt < q[1]); if (!cue) return;
  const a = prog(lt, cue[0], cue[0] + .2) * (1 - prog(lt, cue[1] - .15, cue[1]));
  const s = cue[2], big = tw(s, 38, 700) > 1780, w = Math.min(tw(s, big ? 32 : 38, 700) + 80, 1880);

}
function tag(c, lt) {
  if (!c.tag) return; const a = app(lt, 0, .4); const w = tw(c.tag, 28, 800) + 48;
  box(40, 30, w, 56, 28, 'rgba(88,166,255,.15)', BLUE, a, 2); text(c.tag, 40 + w / 2, 58, 28, BLUE, 800, 'center', a);
}
function termLines(x, y, w, h, lines, lt, size = 26, title = '명령 프롬프트 (cmd)') {
  term(x, y, w, h, title, 1);
  lines.forEach(([kind, s, at, dur], i) => {
    const yy = y + 90 + i * (size * 1.8); if (lt < at - .1) return;
    if (kind === '$') { text('C:\\가계부>', x + 30, yy, size, GREEN, 600, 'left', 1, MONO); text(typed(s, lt, at, at + (dur || 1.4)), x + 30 + tw('C:\\가계부> ', size, 600, MONO), yy, size, INK, 600, 'left', 1, MONO); }

  });
}
// 화면 캡처 한 장 + 확대 이동(keys: [[시각, [sx,sy,sw,sh]], ...]) + 강조 상자(hls: [[t0, t1, [x,y,w,h], 색, 글]])

}

function frame(f) {

  const c = CH.find(c => t >= c.t0 && t < c.t0 + c.dur) || CH[CH.length - 1], lt = t - c.t0;

  DRAW[c.id](lt); tag(c, lt); ctx.restore(); caption(c, lt);
}
