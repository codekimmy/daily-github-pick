<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0d1117;overflow:hidden}canvas{display:block}</style>
<script src="data.js"></script><script src="engine.js"></script>
</head><body><canvas id="c"></canvas>
<script>
// 30초 과정 애니메이션. 숫자는 실제 시연 결과(../results.json), 글은 실제 변환 결과(../work/out/*.md). 문서는 모두 시연용 가상 자료
const q = new URLSearchParams(location.search), W = +q.get('w') || 1920, H = +q.get('h') || 1080, VERT = H > W, FPS = 30;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; setCtx(cv.getContext('2d'), 1);
const T = { c0: 2.5, f0: 11, b0: 18.5, w0: 23.5, e0: 27, end: 30 }, TOTAL = T.end * FPS;
let READY = false;
Promise.all([document.fonts.load(`800 40px ${F}`), document.fonts.load(`500 20px ${MONO}`)]).then(() => READY = true);
const fade = (t, a, b) => prog(t, a, a + .4) * (1 - prog(t, b - .4, b));
const M = VERT ? 60 : 100, FW = W - 2 * M, D = R.F['회의록.docx'];

function sceneIntro(t) {
  const a = fade(t, 0, T.c0); if (a <= 0) return;
  fileIcon('워드', W / 2, VERT ? 600 : 330, VERT ? 360 : 300, a * prog(t, 0, .4));
  text('회의록.docx · ' + kb(D.kb_in), W / 2, VERT ? 880 : 545, VERT ? 44 : 40, SUB, 800, 'center', a);
  text('이 워드 파일, 알맹이는', W / 2, VERT ? 1060 : 700, VERT ? 76 : 72, INK, 900, 'center', a);
  text('몇 KB일까?', W / 2, VERT ? 1180 : 810, VERT ? 104 : 96, GOLD, 900, 'center', a * prog(t, .5, .9));
  text('markitdown', W / 2, VERT ? 1320 : 940, 44, SUB, 800, 'center', a * prog(t, 1.1, 1.5), MONO);
}
function sceneConvert(t) {
  const a = fade(t, T.c0, T.f0); if (a <= 0) return; const lt = t - T.c0;
  text('① 문서를 글(마크다운)로 바꿉니다', W / 2, VERT ? 150 : 70, VERT ? 48 : 50, INK, 900, 'center', a);
  const ty = VERT ? 210 : 120, th = VERT ? 150 : 100;
  term(M, ty, FW, th, '명령 프롬프트 (cmd)', a);
  text(typed('C:\\docs> markitdown 회의록.docx -o 회의록.md', lt, .2, 1.6), M + 24, ty + (VERT ? 100 : 75), VERT ? 30 : 30, INK, 600, 'left', a, MONO);
  const n = R.MD['회의록'].length * prog(lt, 2.4, 6);
  if (VERT) {
    page(M + 60, 400, FW - 120, 600, DOCX, a * prog(lt, 1.6, 2), 1.15);
    text('원본 워드 (' + kb(D.kb_in) + ')', W / 2, 1030, 32, SUB, 800, 'center', a * prog(lt, 1.6, 2));
    mdView(M, 1080, FW, 560, R.MD['회의록'], n, 22, a * prog(lt, 2.2, 2.5));
  } else {
    page(M, 260, FW * .44, 660, DOCX, a * prog(lt, 1.6, 2), 1.08);
    text('원본 워드', M + FW * .22, 950, 30, SUB, 800, 'center', a * prog(lt, 1.6, 2));
    text('→', M + FW * .48, 580, 80, GOLD, 900, 'center', a * prog(lt, 2.2, 2.5));
    mdView(M + FW * .52, 260, FW * .48, 660, R.MD['회의록'], n, 21, a * prog(lt, 2.2, 2.5));
    text('글(마크다운): 제목 #, 표 |, 목록 * 표시가 남음', M + FW * .76, 950, 28, SUB, 700, 'center', a * prog(lt, 4, 4.4));
  }
  const k = ease(prog(lt, 6, 7.4)), v = lerp(D.kb_in, D.kb_out, k);
  pill(`${kb(D.kb_in)} → ${kb(v)} · ${D.sec}초`, W / 2, VERT ? 1730 : 1020, VERT ? 44 : 38, GREEN, a * prog(lt, 6, 6.3));
}
function sceneFormats(t) {
  const a = fade(t, T.f0, T.b0); if (a <= 0) return; const lt = t - T.f0;
  text('② 여러 종류의 문서를 넣어 봤습니다', W / 2, VERT ? 190 : 80, VERT ? 50 : 52, INK, 900, 'center', a);
  const L = ['회의록.docx', '가계부.xlsx', '발표.pptx', '안내문.pdf', '공지.html', '명단_cp949.csv', '화분책.epub', '묶음.zip', '스캔본.pdf', '영수증사진.jpg'].map(f => R.F[f]);
  const cols = VERT ? 2 : 5, cw = (FW - 24 * (cols - 1)) / cols, ch = VERT ? 230 : 330, top = VERT ? 290 : 160, gy = VERT ? 24 : 40;
  let ok = 0;
  L.forEach((r, i) => {
    const at = .3 + i * .45, aa = a * prog(lt, at, at + .3), x = M + (i % cols) * (cw + 24), y = top + Math.floor(i / cols) * (ch + gy), good = r.chars > 0;
    if (lt > at + .5 && good) ok++;
    box(x, y, cw, ch, 18, '#161b22', good ? '#30363d' : RED, aa, 2);
    fileIcon(r.kind, x + (VERT ? 90 : cw / 2), y + (VERT ? ch / 2 : 100), VERT ? 120 : 120, aa);
    const tx = VERT ? x + 190 : x + cw / 2, al = VERT ? 'left' : 'center';
    text(r.kind, tx, y + (VERT ? 60 : 200), VERT ? 34 : 32, INK, 900, al, aa);
    text(good ? `${r.chars.toLocaleString()}자 · ${r.sec}초` : '글자 0자', tx, y + (VERT ? 115 : 250), VERT ? 28 : 26, good ? GREEN : RED, 800, al, aa);
    text(cut(r.label, VERT ? 22 : 22, VERT ? cw - 210 : cw - 30, 600), tx, y + (VERT ? 165 : 292), VERT ? 22 : 22, SUB, 600, al, aa);
    mark(good, x + cw - 34, y + 34, 24, a * prog(lt, at + .5, at + .65));
  });
  const yy = VERT ? top + 5 * (ch + gy) + 40 : H - 70;
  pill(`10가지 중 ${ok}가지 변환 · 스캔 PDF와 사진 속 글자는 못 읽음`, W / 2, yy, VERT ? 32 : 36, ok >= 8 ? GREEN : GOLD, a * prog(lt, 5, 5.3));
}
function sceneBig(t) {
  const a = fade(t, T.b0, T.w0); if (a <= 0) return; const lt = t - T.b0;
  text('③ 큰 파일도 됩니까?', W / 2, VERT ? 220 : 100, VERT ? 56 : 56, INK, 900, 'center', a);
  const C = [['PDF', '설명서 100쪽', R.F['설명서100쪽.pdf'].sec, '문단 1,400개 모두'], ['엑셀', '주문표 1만 줄', R.F['주문1만줄.xlsx'].sec, '1만 줄 모두'], ['파워포인트', '교육 자료 50장', R.F['교육50장.pptx'].sec, '제목 50개 모두']];
  C.forEach(([k, l, s, c], i) => {
    const aa = a * prog(lt, .3 + i * .5, .7 + i * .5), cnt = (s * ease(prog(lt, .5 + i * .5, 2 + i * .5))).toFixed(2);
    let x, y, w, h; if (VERT) { x = M; y = 330 + i * 400; w = FW; h = 360; } else { x = M + i * (FW / 3) + 15; y = 200; w = FW / 3 - 30; h = 600; }
    box(x, y, w, h, 18, '#161b22', '#30363d', aa, 2);
    fileIcon(k, VERT ? x + 120 : x + w / 2, VERT ? y + h / 2 : y + 140, VERT ? 170 : 170, aa);
    const tx = VERT ? x + 250 : x + w / 2, al = VERT ? 'left' : 'center';
    text(l, tx, y + (VERT ? 80 : 300), VERT ? 40 : 40, INK, 900, al, aa);
    text(cnt + '초', tx, y + (VERT ? 180 : 410), VERT ? 84 : 88, GOLD, 900, al, aa);
    text('✔ ' + c + ' 그대로', tx, y + (VERT ? 280 : 520), VERT ? 32 : 32, GREEN, 800, al, aa * prog(lt, 2 + i * .5, 2.3 + i * .5));
  });
}
function sceneWarn(t) {
  const a = fade(t, T.w0, T.e0); if (a <= 0) return; const lt = t - T.w0;
  const by = VERT ? 360 : 170, bh = VERT ? 1100 : 740;
  box(M, by, FW, bh, 18, 'rgba(255,123,114,.08)', RED, a, 2);
  text('⚠ 꼭 알아 둘 점', W / 2, by + 80, VERT ? 56 : 56, RED, 900, 'center', a);
  const L = VERT ? ['스캔한 PDF·사진 속 글자는 0자', '엑셀 빈칸은 NaN으로 나옴', '워드 표 머리줄이 빈 줄로 밀림', 'PDF는 제목 표시(#)가 사라짐', '한글 문서(HWP)는 지원 목록에 없음']
    : ['스캔한 PDF·사진 속 글자는 읽지 못했습니다 (0자)', '엑셀 빈칸은 NaN 으로, 워드 표는 머리줄이 한 칸 밀렸습니다', 'PDF는 글은 나오지만 제목 표시(#)가 사라졌습니다', '한글 문서(HWP)는 변환기 목록에 없습니다'];
  L.forEach((s, i) => text('· ' + s, W / 2, by + (VERT ? 240 : 220) + i * (VERT ? 150 : 120), VERT ? 40 : 40, INK, 700, 'center', a * prog(lt, .3 + i * .4, .7 + i * .4)));
}
function sceneEnd(t) {
  const a = prog(t, T.e0, T.e0 + .4); if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const cy = VERT ? 700 : 300;
  text('markitdown', W / 2, cy, VERT ? 110 : 130, INK, 900, 'center', 1, MONO);
  text('워드·엑셀·PDF를 AI가 읽기 좋은 글로 바꿔 주는 무료 프로그램', W / 2, cy + (VERT ? 130 : 120), VERT ? 34 : 46, SUB, 700);
  text('일반인 쓸모 ★★★★☆', W / 2, cy + (VERT ? 240 : 215), VERT ? 60 : 56, GOLD, 900);
  pill('pip install "markitdown[all]" · 명령은 설명란에', W / 2, cy + (VERT ? 370 : 330), VERT ? 32 : 36, GREEN);
  const d1 = '정보 제공용 · 2026-11-08 클라우드 시연 결과(운영자 직접 검증 아님)', d2 = '변환 결과는 원본과 꼭 비교 · 개인정보 문서를 AI에 올리지 않기 · 원본 보관';
  if (VERT) { text(d1, W / 2, 1480, 28, SUB, 500); text(d2, W / 2, 1524, 26, SUB, 500); }
  else { text(d1, W / 2, H - 92, 26, SUB, 500); text(d2, W / 2, H - 52, 26, SUB, 500); }
  ctx.restore();
}
function frame(f) {
  const t = f / FPS; ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
  sceneIntro(t); sceneConvert(t); sceneFormats(t); sceneBig(t); sceneWarn(t); sceneEnd(t);
}
</script></body></html>
