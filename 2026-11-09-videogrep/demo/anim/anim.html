<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0d1117;overflow:hidden}canvas{display:block}</style>
<script src="data.js"></script><script src="engine.js"></script>
</head><body><canvas id="c"></canvas>
<script>
// 30초 과정 애니메이션. 숫자는 실제 시연 결과(../results.json), 화면 속 영상은 실제 결과 영상(../work/out/*.mp4)에서 뽑은 프레임. 영상은 모두 시연용 가상 영상
const q = new URLSearchParams(location.search), W = +q.get('w') || 1920, H = +q.get('h') || 1080, VERT = H > W, FPS = 30;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; setCtx(cv.getContext('2d'), 1);
const T = { s0: 2.5, r0: 12, m0: 18.5, w0: 23.5, e0: 27, end: 30 }, TOTAL = T.end * FPS;
let READY = false;
Promise.all([document.fonts.load(`800 40px ${F}`), document.fonts.load(`500 20px ${MONO}`), loadFrames('fr')]).then(() => READY = true);
// 깜빡임 방지: 앞 장면이 사라지는 동안 다음 장면이 같이 나타남(빈 화면을 거치지 않음)
const fade = (t, a, b) => (a <= 0 ? 1 : prog(t, a - .25, a + .25)) * (1 - prog(t, b - .25, b + .25));
const M = VERT ? 60 : 100, FW = W - 2 * M, C = R.cases, SR = R.SRT['요리교실'], TOT = R.src['요리교실'].sec;
const HITS = SR.map((l, i) => /소금/.test(l[2]) ? i : -1).filter(i => i >= 0);

function sceneIntro(t) {
  const a = fade(t, 0, T.s0); if (a <= 0) return;
  const n = VERT ? 3 : 5, tw0 = VERT ? 300 : 330, th0 = tw0 * 9 / 16, gx = (W - n * tw0 - (n - 1) * 16) / 2, ty = VERT ? 420 : 170;
  for (let i = 0; i < (VERT ? 9 : 5); i++) { const r = Math.floor(i / n), c = i % n;
    ctx.save(); ctx.globalAlpha = a * prog(t, i * .08, i * .08 + .3); ctx.drawImage(IMG.src[i * (VERT ? 1 : 3)], gx + c * (tw0 + 16), ty + r * (th0 + 16), tw0, th0); ctx.restore(); }
  const by = VERT ? 1060 : 560;
  text(`${mmss(TOT)}짜리 요리 강의 영상`, W / 2, by, VERT ? 48 : 44, SUB, 800, 'center', a);
  text("'소금' 이야기만 모아 보려면?", W / 2, by + (VERT ? 120 : 110), VERT ? 80 : 84, GOLD, 900, 'center', a * prog(t, .5, .9));
  text('videogrep', W / 2, by + (VERT ? 250 : 230), 46, SUB, 800, 'center', a * prog(t, 1.1, 1.5), MONO);
}
function sceneSearch(t) {
  const a = fade(t, T.s0, T.r0); if (a <= 0) return; const lt = t - T.s0;
  text('① 자막에서 낱말을 찾아 그 장면만 잘라 붙입니다', W / 2, VERT ? 150 : 70, VERT ? 44 : 50, INK, 900, 'center', a);
  const ty = VERT ? 220 : 120, th = VERT ? 150 : 100;
  term(M, ty, FW, th, '명령 프롬프트 (cmd)', a);
  const cmd = VERT ? 'videogrep -i 요리교실.mp4 -s 소금' : 'C:\\영상> videogrep -i 요리교실.mp4 -s 소금 -o 소금모음.mp4';
  text(typed(cmd, lt, .2, 1.6), M + 24, ty + (VERT ? 100 : 75), VERT ? 32 : 30, INK, 600, 'left', a, MONO);
  // 원본 타임라인 + 훑는 선
  const lx = M, ly = VERT ? 470 : 300, lw = FW, lh = VERT ? 110 : 90, sc = prog(lt, 2, 4.5);
  text(`원본: 요리교실.mp4 · ${TOT.toFixed(1)}초 · 자막 ${SR.length}줄`, lx, ly - 30, VERT ? 30 : 28, SUB, 700, 'left', a * prog(lt, 1.6, 2));
  const seen = HITS.filter(i => SR[i][0] / TOT < sc);
  timeline(lx, ly, lw, lh, SR, TOT, seen, a * prog(lt, 1.6, 2), 1);
  if (sc > 0 && sc < 1) box(lx + lw * sc - 2, ly - 10, 4, lh + 20, 2, RED, null, a);
  // 찾은 줄 목록
  const listY = VERT ? 680 : 470;
  HITS.forEach((h, k) => { const at = 2 + 2.5 * SR[h][0] / TOT, aa = a * prog(lt, at, at + .3) * (1 - prog(lt, 5, 5.4));
    const yy = listY + k * (VERT ? 92 : 62);
    pill(mmss(SR[h][0]), M + (VERT ? 70 : 60), yy, VERT ? 28 : 26, GOLD, aa);
    text(cut(SR[h][2], VERT ? 30 : 30, FW - (VERT ? 160 : 150), 700), M + (VERT ? 150 : 130), yy, VERT ? 30 : 30, INK, 700, 'left', aa); });
  // 결과 바: 찾은 장면만 붙인 새 영상 (길이 비율 그대로)
  const ry = VERT ? 1120 : 760, out = C.salt.out_sec, k = ease(prog(lt, 5.5, 7.5));
  text(`결과: 소금모음.mp4 · 장면 ${C.salt.n}개`, lx, ry - 30, VERT ? 30 : 28, SUB, 700, 'left', a * prog(lt, 5.3, 5.6));
  let acc = 0; C.salt.clips.forEach((c, i) => { const d = c.end - c.start, sx = lx + lw * c.start / TOT, ex = lx + lw * acc / TOT, x = lerp(sx, ex, k);
    box(x, lerp(ly, ry, k), lw * d / TOT, lh, 6, 'rgba(242,193,78,.85)', GOLD, a * prog(lt, 5.3, 5.6), 2); acc += d; });
  const v = lerp(TOT, out, ease(prog(lt, 7.3, 8.8)));
  pill(`${v.toFixed(1)}초 → 장면 ${C.salt.n}개만 · 만드는 데 ${C.salt.make_sec}초`, W / 2, VERT ? 1340 : 960, VERT ? 38 : 40, GREEN, a * prog(lt, 7.3, 7.6));
}
function sceneResult(t) {
  const a = fade(t, T.r0, T.m0); if (a <= 0) return; const lt = t - T.r0;
  text('② 만들어진 영상 (실제 결과)', W / 2, VERT ? 170 : 70, VERT ? 52 : 52, INK, 900, 'center', a);
  // 장면마다 1.5초씩 보여 줌 (결과 영상 안 각 장면 시작 + 1초부터)
  const cl = C.salt.clips; let starts = [], acc = 0; cl.forEach(c => { starts.push(acc); acc += c.end - c.start; });
  const k = clamp(Math.floor(lt / 1.55), 0, cl.length - 1), vt = starts[k] + 1 + (lt - k * 1.55);
  const pw = VERT ? FW : 1120, ph = pw * 9 / 16, px = VERT ? M : M, py = VERT ? 300 : 140;
  player(px, py, pw, ph, '소금모음', vt, `소금모음.mp4 · 장면 ${k + 1}/${cl.length}`, a);
  const lx = VERT ? M : px + pw + 50, ly = VERT ? py + ph + 120 : 170, lw = VERT ? FW : FW - pw - 50;
  cl.forEach((c, i) => { const yy = ly + i * (VERT ? 110 : 150), on = i === k, aa = a * prog(lt, i * 1.55, i * 1.55 + .3);
    box(lx, yy, lw, VERT ? 92 : 128, 14, on ? 'rgba(242,193,78,.12)' : '#161b22', on ? GOLD : '#30363d', aa, 2);
    text(`원본 ${mmss(c.start)} → 결과 ${mmss(starts[i])}`, lx + 20, yy + (VERT ? 28 : 36), VERT ? 26 : 26, on ? GOLD : SUB, 800, 'left', aa);
    text(cut(c.text, VERT ? 24 : 22, lw - 40, 600), lx + 20, yy + (VERT ? 64 : 88), VERT ? 24 : 22, INK, 600, 'left', aa); });
  text('화면 오른쪽 위 "원본 시각"이 장면마다 건너뜁니다', W / 2, VERT ? 1700 : H - 50, VERT ? 30 : 30, SUB, 700, 'center', a * prog(lt, 1, 1.3));
}
function sceneMore(t) {
  const a = fade(t, T.m0, T.w0); if (a <= 0) return; const lt = t - T.m0;
  text('③ 다른 낱말로도 찾아봤습니다', W / 2, VERT ? 200 : 90, VERT ? 54 : 54, INK, 900, 'center', a);
  const L = [["말버릇 '음,'", '요리 강의', C.um], ["'결정'", '회의 녹화', C.decide], ["'예산|만 원'", '회의 · 두 낱말 한 번에', C.regex], ["'소금'", `30분 영상 · 자막 ${R.src['긴강의'].lines}줄`, C.long]];
  L.forEach(([q, w, c], i) => { const aa = a * prog(lt, .3 + i * .5, .7 + i * .5);
    let x, y, bw, bh; if (VERT) { x = M; y = 300 + i * 330; bw = FW; bh = 290; } else { x = M + (i % 2) * (FW / 2 + 15); y = 180 + Math.floor(i / 2) * 380; bw = FW / 2 - 15; bh = 340; }
    box(x, y, bw, bh, 18, '#161b22', '#30363d', aa, 2);
    text(q, x + 40, y + 70, VERT ? 48 : 50, GOLD, 900, 'left', aa); text(w, x + 40, y + 130, VERT ? 30 : 30, SUB, 700, 'left', aa);
    const n = Math.round(c.n * ease(prog(lt, .5 + i * .5, 1.8 + i * .5)));
    text(`장면 ${n}개`, x + 40, y + (VERT ? 215 : 230), VERT ? 60 : 64, INK, 900, 'left', aa);
    text(`결과 ${c.out_sec}초 · 만드는 데 ${c.make_sec}초`, x + bw - 40, y + (VERT ? 215 : 300), VERT ? 28 : 30, GREEN, 800, 'right', aa * prog(lt, 1.8 + i * .5, 2.1 + i * .5)); });
}
function sceneWarn(t) {
  const a = fade(t, T.w0, T.e0); if (a <= 0) return; const lt = t - T.w0;
  const by = VERT ? 360 : 150, bh = VERT ? 1100 : 780;
  box(M, by, FW, bh, 18, 'rgba(255,123,114,.08)', RED, a, 2);
  text('⚠ 꼭 알아 둘 점', W / 2, by + 80, 56, RED, 900, 'center', a);
  const L = VERT ? ['영상과 같은 이름의 자막 파일(.srt)이 꼭 필요', '자막 한 줄 단위로 자름 (낱말 단위는 안 됨)', '자동 받아쓰기는 영어 모델만 들어 있음', '라이선스: 개인·비영리용 (일반 회사는 불가)']
    : ['영상과 같은 이름의 자막 파일(.srt·.vtt)이 꼭 있어야 합니다', '자막 한 줄 단위로 자릅니다 (낱말 하나만 자르기는 안 됨)', '자동 받아쓰기(--transcribe)는 영어 모델만 들어 있습니다', '라이선스: 개인·비영리 단체용 — 이익을 내는 일반 회사는 쓸 수 없음'];
  L.forEach((s, i) => text('· ' + s, W / 2, by + (VERT ? 240 : 220) + i * (VERT ? 170 : 130), VERT ? 38 : 40, INK, 700, 'center', a * prog(lt, .3 + i * .4, .7 + i * .4)));
}
function sceneEnd(t) {
  const a = prog(t, T.e0 - .25, T.e0 + .25); if (a <= 0) return; ctx.save(); ctx.globalAlpha = a;
  const cy = VERT ? 700 : 300;
  text('videogrep', W / 2, cy, VERT ? 120 : 130, INK, 900, 'center', 1, MONO);
  text('자막에서 낱말을 찾아 그 장면만 이어 붙여 주는 무료 프로그램', W / 2, cy + (VERT ? 130 : 120), VERT ? 34 : 46, SUB, 700);
  text('일반인 쓸모 ★★★☆☆', W / 2, cy + (VERT ? 240 : 215), VERT ? 60 : 56, GOLD, 900);
  pill('pip install videogrep · 명령은 설명란에', W / 2, cy + (VERT ? 370 : 330), VERT ? 34 : 36, GREEN);
  const d1 = '정보 제공용 · 2026-11-09 클라우드 시연 결과(운영자 직접 검증 아님)', d2 = '남의 영상은 저작권 확인 · 개인·비영리용 라이선스 · 원본 영상 보관';
  if (VERT) { text(d1, W / 2, 1480, 28, SUB, 500); text(d2, W / 2, 1524, 28, SUB, 500); }
  else { text(d1, W / 2, H - 92, 26, SUB, 500); text(d2, W / 2, H - 52, 26, SUB, 500); }
  ctx.restore();
}
function frame(f) {
  const t = f / FPS; ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
  sceneIntro(t); sceneSearch(t); sceneResult(t); sceneMore(t); sceneWarn(t); sceneEnd(t);
}
</script></body></html>
