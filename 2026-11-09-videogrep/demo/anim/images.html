<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0d1117;overflow:hidden}canvas{display:block}</style>
<script src="data.js"></script><script src="engine.js"></script>
</head><body><canvas id="c"></canvas>
<script>
// 썸네일 (1280×720). 화면은 실제 결과 영상 프레임, 숫자는 results.json
const W = 1280, H = 720, cv = document.getElementById('c'); cv.width = W; cv.height = H; setCtx(cv.getContext('2d'), 1);
let READY = false; const C = R.cases, SR = R.SRT['요리교실'], TOT = R.src['요리교실'].sec;
Promise.all([document.fonts.load(`900 40px ${F}`), document.fonts.load(`500 20px ${MONO}`), loadFrames('fr')]).then(() => { draw(); READY = true; });
function draw() {
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
  player(40, 60, 560, 315, '소금모음', 1.2, '소금모음.mp4 (실제 결과)');
  const hits = SR.map((l, i) => /소금/.test(l[2]) ? i : -1).filter(i => i >= 0);
  timeline(40, 470, 560, 60, SR, TOT, hits, 1, 1, false); text(`원본 ${TOT.toFixed(0)}초`, 40, 452, 22, SUB, 700, 'left');
  let a = 0; C.salt.clips.forEach(c => { box(40 + 560 * a / TOT, 590, 560 * (c.end - c.start) / TOT, 60, 6, 'rgba(242,193,78,.9)', GOLD, 1, 2); a += c.end - c.start; });
  text(`결과 ${C.salt.out_sec.toFixed(0)}초`, 40, 572, 22, GOLD, 700, 'left');
  text("영상에서", 950, 170, 62, INK, 900); text("'이 말'만", 950, 265, 88, GOLD, 900); text('쏙 모으기', 950, 365, 76, INK, 900);
  text(`${TOT.toFixed(0)}초 → ${C.salt.out_sec.toFixed(0)}초`, 950, 480, 54, GREEN, 900); text('videogrep · 무료', 950, 570, 34, SUB, 700, 'center', 1, MONO);
}
</script></body></html>
