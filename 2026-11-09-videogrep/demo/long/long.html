<html><head><meta charset="utf-8">

<script>
// 롱폼 본편(미리보기 뒤). 숫자는 실제 시연 결과(../results.json), 화면 속 영상은 실제 결과 영상(../work/out/*.mp4)에서 뽑은 프레임. 영상은 모두 시연용 가상 영상
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; setCtx(cv.getContext('2d'), 1);
const CH = SCRIPT.chapters; let acc = 0; CH.forEach(c => { c.t0 = acc; acc += c.dur; });
const TOTAL = Math.round(acc * FPS);
let READY = false;
Promise.all([document.fonts.load(`800 40px ${F}`), document.fonts.load(`500 20px ${MONO}`), loadFrames('../anim/fr')]).then(() => READY = true);
const app = (lt, a, d = 0.5) => prog(lt, a, a + d);
const M = 120, FW = W - 240, C = R.cases, SY = R.SRT['요리교실'], SM = R.SRT['회의'], TY = R.src['요리교실'].sec, TM = R.src['회의'].sec;
const hitsOf = (srt, re) => srt.map((l, i) => re.test(l[2]) ? i : -1).filter(i => i >= 0);
// 깜빡임 방지: 자막을 전체 시간 기준으로 이어 붙임. 다음 자막까지 0.6초 안이면 상자를 끄지 않고 글만 겹쳐 바꿈, 상자 너비도 부드럽게
const CAP = []; CH.forEach(c => c.cues.forEach(q => CAP.push([c.t0 + q[0], c.t0 + q[1], q[2]])));
CAP.forEach((q, i) => { const n = CAP[i + 1]; q.join = !!n && n[0] - q[1] < .6; if (q.join) q[1] = n[0]; });
const capSize = s => tw(s, 38, 700) > 1780 ? 32 : 38, capW = s => Math.min(tw(s, capSize(s), 700) + 80, 1880);
function caption(t) {
  const i = CAP.findIndex(q => t >= q[0] && t < q[1]); if (i < 0) return;
  const q = CAP[i], p = CAP[i - 1], joinPrev = p && p.join, k = joinPrev ? ease(prog(t, q[0], q[0] + .3)) : 1;
  const a = (joinPrev ? 1 : prog(t, q[0], q[0] + .2)) * (q.join ? 1 : 1 - prog(t, q[1] - .15, q[1]));
  const w = joinPrev ? lerp(capW(p[2]), capW(q[2]), k) : capW(q[2]);
  box(W / 2 - w / 2, 952, w, 80, 16, 'rgba(1,4,9,.92)', null, a);
  if (joinPrev && k < 1) text(p[2], W / 2, 992, capSize(p[2]), INK, 700, 'center', a * (1 - k));
  text(q[2], W / 2, 992, capSize(q[2]), INK, 700, 'center', a * k);
}
function tag(c, lt, a = 1) {
  if (!c.tag) return; const w = tw(c.tag, 28, 800) + 48;
  box(40, 30, w, 56, 28, 'rgba(88,166,255,.15)', BLUE, a, 2); text(c.tag, 40 + w / 2, 58, 28, BLUE, 800, 'center', a);
}
function termLines(x, y, w, h, lines, lt, size = 26, title = '명령 프롬프트 (cmd)', A = 1) {
  if (A <= 0) return; ctx.save(); ctx.globalAlpha *= A; term(x, y, w, h, title, 1);
  lines.forEach(([kind, s, at, dur], i) => {
    const yy = y + 90 + i * (size * 1.8); if (lt < at - .1) return;
    if (kind === '$') { text('C:\\영상>', x + 30, yy, size, GREEN, 600, 'left', 1, MONO); text(typed(s, lt, at, at + (dur || 1.4)), x + 30 + tw('C:\\영상> ', size, 600, MONO), yy, size, INK, 600, 'left', 1, MONO); }
    else text(cut(s, size, w - 60, 600), x + 30, yy, size, kind === 'ok' ? GREEN : kind === 'note' ? GOLD : kind === 'err' ? RED : kind === 'hit' ? GOLD : SUB, 600, 'left', app(lt, at, .3), MONO);
  });
 ctx.restore();
}
const demoLine = c => `${c.file} ${c.start} ${c.end} ${c.text}`;
// 결과 영상 재생 (장면 목록 옆에) — 플레이어 시각 = lt - at
function playWithList(name, cs, lt, at, title) {
  let st = [], a0 = 0; cs.forEach(c => { st.push(a0); a0 += c.end - c.start; });
  const vt = Math.max(0, lt - at), k = st.filter(s => s <= vt).length - 1;
  player(M, 300, 960, 540, name, vt, `${title} · 장면 ${Math.max(1, k + 1)}/${cs.length}`, app(lt, at - .3));
  cs.forEach((c, i) => { const yy = 300 + i * 118, on = i === k && lt > at, aa = app(lt, at - .3 + i * .15);

    text(`원본 ${mmss(c.start)} → 결과 ${mmss(st[i])}`, M + 1030, yy + 30, 24, on ? GOLD : SUB, 800, 'left', aa);
    text(cut(c.text, 22, FW - 1050, 600), M + 1030, yy + 72, 22, INK, 600, 'left', aa); });
}

    for (let i = 0; i < 5; i++) { ctx.save(); ctx.globalAlpha = app(lt, 8 + i * .25); ctx.drawImage(IMG.src[i * 3], M + i * 340, 660, 320, 180); ctx.restore(); }

  what(lt) {

      text('영상: 자막 줄마다 시각이 있으므로 → 그 구간을 오려 냄', M, 370, 34, SUB, 800, 'left', app(lt, 9));

        box(lerp(M + FW * c.start / TY, M + FW * a0 / TY, k), lerp(400, 640, k), FW * d / TY, 110, 6, 'rgba(242,193,78,.85)', GOLD, app(lt, 16.5), 2); a0 += d; });
      text(`새 영상: ${C.salt.out_sec}초 (장면 ${C.salt.n}개)`, M, 610, 30, GREEN, 800, 'left', app(lt, 19.5));

      ['', `Successfully installed videogrep-${R.version} moviepy-1.0.3 imageio-ffmpeg numpy ...`, 11], ['note', `:: 약 ${Math.round(R.install.sec)}초 · ${R.install.mb}MB (새 폴더 기준, 내려받기 포함 · ffmpeg·영어 받아쓰기 모델 포함)`, 16]], lt, 28);

    if (lt > 23) pill('시연 영상: 기계 음성(espeak-ng)으로 만든 가상 강의·회의 — 실제 기관과 관련 없음', W / 2, 820, 30, SUB, app(lt, 23));

      text(`자막 ${SY.length}줄 중 ${C.salt.n}줄 · 찾기 ${C.salt.demo_sec}초`, W / 2, 780, 34, GOLD, 800, 'center', app(lt, 9)); ctx.restore(); }

  um(lt) {

  },
  meet(lt) {

    if (lt < 7) timeline(M, 500, FW, 100, SM, TM, prog(lt, 3, 3.5) > 0 ? hitsOf(SM, /결정/) : [], app(lt, 2.5) * (1 - prog(lt, 6.4, 7)), 1);
    if (lt > 6.5) playWithList('결정모음', C.decide.clips, lt, 7.5, '결정모음.mp4');
    if (lt > 24) pill(`✔ 결정_자막.vtt 도 함께 생김 (${C.vtt.n}줄)`, M + 1010 + (FW - 1010) / 2, 830, 28, GREEN, app(lt, 24));

  regex(lt) {
    // 깜빡임 방지: 앞 부분(예산)이 사라지는 동안 뒷부분(두 영상)이 나타남
    [[0, 1 - prog(lt, 13.6, 14.2)], [1, prog(lt, 13.8, 14.4)]].forEach(([sec, a]) => { if (a <= 0) return;
      const c = sec ? C.both : C.regex, base = sec ? 14 : 0; ctx.save(); ctx.globalAlpha *= a;
      termLines(M, 130, FW, 150, [['$', sec ? 'videogrep -i 요리교실.mp4 회의.mp4 -s 마지막 -o 마지막_두영상.mp4' : 'videogrep -i 회의.mp4 -s "예산|만 원" -o 돈이야기.mp4', base + .4, 2]], lt, 26);

        text(cut(x.text, 30, FW - 340, 700), M + 310, yy, 30, INK, 700, 'left', aa); });

  },
  opt(lt) {
    const L = [['-p 0.5', '앞뒤로 0.5초 여유', `장면 4개 → ${C.pad.n}개 (붙은 두 장면이 합쳐짐) · ${C.pad.out_sec}초`, .3, GOLD], ['-m 2', '앞에서부터 2장면만', `${C.max.n}장면 · ${C.max.out_sec}초`, 16, BLUE], ['--export-clips', '장면을 파일 하나씩', C.export.files.join('  '), 24, GREEN]];

      text(o, M + 40, yy + 60, 44, c, 900, 'left', aa, MONO); text(d, M + 520, yy + 60, 36, INK, 800, 'left', aa); text(r, M + 40, yy + 145, 30, SUB, 700, 'left', app(lt, at + 1)); });
    if (lt > 8 && lt < 16) { const P = C.pad.clips, pa = app(lt, 8, .4) * (1 - prog(lt, 15.4, 16)); ctx.save(); ctx.globalAlpha *= pa; timeline(M + 860, 300, FW - 900, 50, SY, TY, [], 1, 1, false); P.forEach(c => box(M + 860 + (FW - 900) * c.start / TY, 300, Math.max(6, (FW - 900) * (c.end - c.start) / TY), 50, 4, 'rgba(242,193,78,.9)', GOLD, app(lt, 8.3), 2)); ctx.restore(); }

  export(lt) {

function frame(f) {
  const t = f / FPS; ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
  const ci = Math.max(0, CH.findIndex(c => t >= c.t0 && t < c.t0 + c.dur)), c = CH[ci], lt = t - c.t0, k = ci === 0 ? 1 : ease(prog(lt, 0, .6));
  if (k < 1) { const p = CH[ci - 1]; ctx.save(); ctx.globalAlpha = 1 - k; DRAW[p.id](p.dur - .001); ctx.restore(); tag(p, p.dur, 1 - k); }
  ctx.save(); ctx.globalAlpha = k; DRAW[c.id](lt); ctx.restore();
  tag(c, lt, k); caption(t);
}
