// 롱폼 (미리보기 포함 전체). 효과 화면은 terminaltexteffects 가 만든 실제 프레임(../anim/fx.js), 숫자는 실제 시연 결과(../results.json). 인사 글은 시연용으로 직접 쓴 글
const W = 1920, H = 1080, FPS = 30;

if (typeof TIMING !== 'undefined') SCRIPT.chapters.forEach((c, i) => { const T = TIMING[i]; c.dur = T.dur; c.cues = T.cues; c.knots = T.knots; });
const remap = (c, lt) => { const K = c.knots; if (!K) return lt; for (let i = 1; i < K.length; i++) if (lt <= K[i][0]) { const [a0, b0] = K[i - 1], [a1, b1] = K[i]; return a1 > a0 ? b0 + (b1 - b0) * (lt - a0) / (a1 - a0) : b1; } return K[K.length - 1][1]; };

let READY = false;
Promise.all([document.fonts.load(`800 40px ${F}`), document.fonts.load(`500 20px ${MONO}`)]).then(() => READY = true);

// 깜빡임 방지: 자막을 전체 시간 기준으로 이어 붙임. 다음 자막까지 0.6초 안이면 상자를 끄지 않고 글만 겹쳐 바꿈, 상자 너비도 부드럽게
const CAP = []; CH.forEach(c => c.cues.forEach(q => CAP.push([c.t0 + q[0], c.t0 + q[1], q[2]])));
CAP.forEach((q, i) => { const n = CAP[i + 1]; q.join = !!n && n[0] - q[1] < .6; if (q.join) q[1] = n[0]; });

function caption(t) {

function termLines(x, y, w, h, lines, lt, size = 26, title = '명령 프롬프트 (cmd)', A = 1) {

// 깜빡임 방지: 장이 바뀔 때 앞 장 마지막 모습이 사라지는 동안 새 장이 나타남(크로스페이드 0.6초)
function frame(f) {
  const t = f / FPS; ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H);
  const ci = Math.max(0, CH.findIndex(c => t >= c.t0 && t < c.t0 + c.dur)), c = CH[ci], lt = t - c.t0, k = ci === 0 ? 1 : ease(prog(lt, 0, .6));
  if (k < 1) { const p = CH[ci - 1]; ctx.save(); ctx.globalAlpha = 1 - k; DRAW[p.id](remap(p, p.dur - .001)); ctx.restore(); tag(p, p.dur, 1 - k); }
  ctx.save(); ctx.globalAlpha = k; DRAW[c.id](remap(c, lt)); ctx.restore();
  tag(c, lt, k); caption(t);
}
