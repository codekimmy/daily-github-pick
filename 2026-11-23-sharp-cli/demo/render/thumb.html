<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0d1117;overflow:hidden}canvas{display:block}</style>
<link rel="stylesheet" href="../../../tools/kit/kit.css"><script src="../../../tools/kit/kit.js"></script>
<script src="timing.js"></script><script src="data.js"></script><script src="engine.js"></script><script src="scenes.js"></script>
</head><body><canvas id="c"></canvas>
<script>
// ?s=thumb (1280×720) | thumbv (1080×1920) | ba (전·후 1600×900) | fmt (형식 비교) | q (화질 값 확대) | rot (세로 사진) — 모두 시연 측정값(data.js)·시연 결과 그림(img/)
const S = new URLSearchParams(location.search).get('s') || 'thumb';
const SZ = { thumb: [1280, 720], thumbv: [1080, 1920], ba: [1600, 900], fmt: [1600, 900], q: [1600, 900], rot: [1600, 900] }[S], W = SZ[0], H = SZ[1];
const cv = document.getElementById('c'); cv.width = W; cv.height = H; ctx = cv.getContext('2d');
let READY = false;
Promise.all([document.fonts.load(`900 40px ${F}`), document.fonts.load(`600 20px ${MONO}`), IMG_READY]).then(() => { draw(); READY = true; });
function big(s, x, y, size, col, font = F, w = 900) { ctx.save(); ctx.font = `${w} ${size}px ${font}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = size * .16; ctx.strokeStyle = '#05070c'; ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y); ctx.restore(); }
const foot = () => text('2026-11-23 클라우드 시연 결과 · 시연용 가상 사진', W - 20, H - 20, 18, SUB, 500, 'right');
function draw() {
  KIT.bg(ctx, W, H);
  if (S === 'thumb') {
    pic('p2', 60, 120, 400, 300); text('16.5MB', 260, 460, 44, RED, 900); big('→', 520, 270, 70, INK);
    vacBag(740, 270, 260, 195, 1, 1, 0); pic('p2', 610, 172, 260, 195); text('1.64MB', 740, 460, 44, GREEN, 900);
    big('사진 6장', 1080, 170, 76, '#ffffff'); big('0.5초 만에', 1080, 290, 76, GOLD); big('1/10 용량', 1080, 410, 76, GOLD);
    big('위치 정보도 삭제', 1080, 520, 44, GREEN); big('sharp-cli', 640, 640, 72, GOLD, MONO, 700);
  } else if (S === 'thumbv') {
    big('사진 6장 용량', 540, 330, 100, '#ffffff'); big('0.5초 만에 1/10', 540, 470, 96, GOLD);
    grid6Vert(60, 620, 960, 760, 1, .82, AFT_MB, GREEN);
    big('16.5MB → 1.64MB', 540, 1450, 70, GREEN); big('sharp-cli', 540, 1600, 90, GOLD, MONO, 700);
  } else if (S === 'ba') {
    text('sharp-cli 시연: 휴대폰 크기 가상 사진 6장 (가로 1600, JPG 화질 80)', 800, 50, 34, INK, 900);
    text('줄이기 전 · 각 4032 × 3024', 400, 115, 34, RED, 900); text('줄인 뒤 · 각 1600 × 1200 · 약 0.5초', 1200, 115, 34, GREEN, 900);
    grid6(20, 150, 760, 620, 1, 1, BEF_MB, INK, { fs: 26 }); grid6(820, 150, 760, 620, 1, .62, AFT_MB, GREEN, { fs: 26 });
    text('합계 16.50MB · 위치 정보 있음', 400, 820, 32, RED, 800); text('합계 1.64MB · 위치 정보 없음', 1200, 820, 32, GREEN, 800); foot();
  } else if (S === 'fmt') {
    text('같은 6장을 가로 1600으로 · 형식별 합계 용량과 원본과 닮은 정도(SSIM, 1 = 똑같음)', 800, 50, 30, INK, 900);
    const rows = [['JPG (화질 80)', FM.jpeg, BLUE], ['WebP (화질 80)', FM.webp, GREEN], ['AVIF (화질 50)', FM.avif, GOLD], ['PNG (무손실)', FM.png, RED]];
    rows.forEach(([n, r, col], i) => { const y = 150 + i * 170, bw = 800 * r.total / 25;
      text(n, 300, y + 40, 34, col, 900, 'right'); box(330, y + 10, Math.max(10, bw), 60, 10, col, null, .9);
      text(`${r.total.toFixed(2)}MB · 닮은 정도 ${r.ssim.toFixed(3)} · ${r.sec.toFixed(1)}초`, 350 + Math.max(10, bw), y + 40, 30, INK, 800, 'left'); });
    ctx.save(); ctx.strokeStyle = SUB; ctx.setLineDash([10, 8]); ctx.lineWidth = 3; const ox = 330 + 800 * 16.5 / 25; ctx.beginPath(); ctx.moveTo(ox, 130); ctx.lineTo(ox, 820); ctx.stroke(); ctx.restore();
    text('원본 합계 16.5MB', ox, 845, 26, SUB, 800); foot();
  } else if (S === 'q') {
    text('화질 값(WebP)에 따른 용량과 닮은 정도 — 산풍경 1600px 결과의 같은 자리를 3배 확대', 800, 50, 30, INK, 900);
    ['95', '80', '40', '20'].forEach((q, i) => { const x = 40 + i * 390, w = 360, h = 270;
      pic('q' + q, x, 120, w, h, 1, q === '20' ? RED : LINE); text('화질 ' + q, x + w / 2, 440, 40, GOLD, 900);
      text(QR[q].kb.toFixed(0) + 'KB', x + w / 2, 500, 44, INK, 900); text('닮은 정도 ' + QR[q].ssim.toFixed(3), x + w / 2, 560, 32, i < 2 ? GREEN : RED, 800); });
    text('화질 값이 작을수록 용량은 줄고, 잔무늬가 뭉개짐 (기본값 80)', 800, 680, 34, INK, 800); foot();
  } else {
    text('세로로 찍은 휴대폰 사진(EXIF 방향 값 6)을 줄인 결과', 800, 50, 34, INK, 900);
    pic('rot_default', 80, 180, 640, 480); cross(670, 230, 90); text('기본 실행 · 1600 × 1200 (누움)', 400, 720, 34, RED, 900);
    pic('rot_auto', 1000, 130, 450, 600); check(1400, 190, 90, 1); text('--autoOrient · 1200 × 1600', 1225, 780, 34, GREEN, 900); foot();
  }
}
</script></body></html>
