<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 썸네일·블로그 그림용 틀 (2026-11-25 운영자 요청). 날짜 폴더 demo/render/thumb.html 로 복사해서 쓴다.
     그림마다 장면은 demo/render/thumbs.js 의 THUMBS = { id: { w, h, file, bg, scene: S => t => {...} } } 에 만든다.
     render_thumbs.py 가 ?s=id&w=&h=&mode=thumb 로 열어 마지막 프레임(3초)을 찍는다 -->
<link rel="stylesheet" href="../../../tools/motion/motion.css">
<script src="../../../tools/motion/motion.js"></script><script src="../../../tools/motion/buddy.js"></script>
<script src="timing.js"></script><script src="data.js"></script><script src="thumbs.js"></script>
</head><body>
<script>
const SID = new URLSearchParams(location.search).get('s');
const TH = THUMBS[SID];
if (TH) M.run({
  chapters: [{ id: SID, tag: '', t0: 0, dur: 3, cues: [[10, 11, ' ']] }],   // 자막 상자가 나오지 않게 자막 시간을 그림 밖에 둠
  scenes: { [SID]: TH.scene }, opts: { [SID]: { bg: TH.bg || M.C.beige } }, disclaimer: [], brand: ''
});
</script></body></html>
