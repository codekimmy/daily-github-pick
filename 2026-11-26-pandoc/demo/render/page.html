<script>
const MODE = new URLSearchParams(location.search).get('mode') || 'long';
M.run({
  chapters: MODE === 'long' ? LONG : SHORTS,
  scenes: SCENES,
  opts: { title: { trans: 'dots' } },                 // 장별 배경색·전환: { 장id: { bg:'#E3EDF8', trans:'dots' } } (기본: 바탕 5색 차례, 크로스페이드 0.6초)

  endScene: { name: 'pandoc · 문서 통역사', disclaimer: DISCLAIMER },
  disclaimer: DISCLAIMER,
  brand: ''                                            // 오른쪽 위 채널 이름을 넣으려면 글자를 적음
});
