<html lang="ko"><head><meta charset="utf-8"><title>겨울철 실내 습도 관리법 (시연용 가상 기사)</title></head>
<body>
<h1>겨울철 실내 습도 관리법</h1>
<p><em>시연용 가상 기사입니다.</em></p>
<p>겨울에는 난방 때문에 실내가 <strong>쉽게 건조해집니다</strong>. 아래 세 가지를 확인해 보시기 바랍니다.</p>
<h2>1. 습도계 두기</h2>
<p>거실과 침실에 작은 습도계를 하나씩 둡니다.</p>
<h2>2. 빨래 널기</h2>
<p>젖은 빨래를 실내에 널면 습도가 올라갑니다.</p>
<h2>3. 환기하기</h2>
<ul><li>아침 10분</li><li>저녁 10분</li></ul>
<table><thead><tr><th>방</th><th>권장 습도</th></tr></thead>
<tbody><tr><td>거실</td><td>40~60%</td></tr><tr><td>침실</td><td>40~60%</td></tr></tbody></table>
</body></html>
